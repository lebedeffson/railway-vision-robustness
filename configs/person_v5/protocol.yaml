protocol_id: person-canonical-v5-range-aware-v1
code_name: person-canonical-v5
parent_protocol: canonical-v5-person-data-first-v1
parent_commit: f846a420e4f563d8fa5ecf098135aad4e5ab84ec

claim_boundary:
  scientific_question: P2_and_geometrically_valid_person_pasting_for_scene_generalization
  development_only_until_full_OOF_PASS: true
  test_sealed: true
  test_marker: outputs/person_v3/test/TEST_OPENED.json
  attacks_blocked: true
  tnorm_diagnostics_blocked: true
  D1_status: FAIL
  D1_two_fold_gate: outputs/person_v5/triage/two_fold_gate.json

frozen_inputs:
  development_manifest:
    path: data/yolo_osdar23_rescue_v1/manifest.csv
    sha256: 14ebd490d9c0be7dc4b305031dafa2c329b710c258b8c194b21bd15952330331
  folds:
    path: outputs/person_v3/protocol/folds.json
    sha256: ff5a6268c394d396c05440b8d309cf5256f998b6c371c66bc52ac9c9bccb14bf
  tile_manifest:
    path: outputs/canonical_m4/tiling_audit/tile_manifest.csv
    sha256: 3821295bdf84524d71aecf786921cfda5b1ea3d76968e9a04e3a6161f071721c
  initialization:
    path: yolo11m.pt
    sha256: d5ffc1a674953a08e11a8d21e022781b1b23a19b730afc309290bd9fb5305b95

development_diagnostic:
  folds: [0, 1]
  image_size: 640
  confidence_threshold: 0.07
  iou_threshold: 0.50
  AP_IoU: [0.50, 0.55, 0.60, 0.65, 0.70, 0.75, 0.80, 0.85, 0.90, 0.95]
  tiling: frozen_M4_overlapping_2x2
  fusion: frozen_M4_class_aware_NMS
  class_mapping: {0: person}
  states:
    B0:
      role: original_person_v3_baseline
      fold_0:
        checkpoint: outputs/person_v3/scene_cv/fold_0/seed_20260723/stage2/weights/best.pt
        sha256: 5a8483b1d40938f49b05225cfe4b3c92414e874fe72008746396ea32bcfb0a79
        results: outputs/person_v3/scene_cv/fold_0/seed_20260723/stage2/results.csv
      fold_1:
        checkpoint: outputs/person_v3/scene_cv/fold_1/seed_20260723/stage2/weights/best.pt
        sha256: 66c84c3e66b82ff722dac5f76647d5526aef4af2091f8f83f3429a489a934695
        results: outputs/person_v3/scene_cv/fold_1/seed_20260723/stage2/results.csv
    B1:
      role: CrowdHuman_zero_shot
      checkpoint: outputs/person_v5/external_pretraining/run/weights/best.pt
      sha256: c16f796a297b0418cf315212a7d12a00b25825d857782da84f24653909723de6
      results: outputs/person_v5/external_pretraining/run/results.csv
    D1_best:
      role: CrowdHuman_then_direct_railway_finetuning_best
      fold_0:
        checkpoint: outputs/person_v5/railway/fold_0/full/weights/best.pt
        sha256: 29bf49f751639a7a4572bf465140a67e61f93325ad94bd20e975cd07fd9e2a64
        results: outputs/person_v5/railway/fold_0/full/results.csv
      fold_1:
        checkpoint: outputs/person_v5/railway/fold_1/full/weights/best.pt
        sha256: de5560daea845254c5f1b586bc8245965a0a2edbc2d4e180ed8c9f6bf39a9cf3
        results: outputs/person_v5/railway/fold_1/full/results.csv
    D1_last:
      role: CrowdHuman_then_direct_railway_finetuning_last
      fold_0:
        checkpoint: outputs/person_v5/railway/fold_0/full/weights/last.pt
        sha256: 43f2d363391c86b44d76e461f480efbe9be1e506d53924d430edeb4f3bbd6ce3
        results: outputs/person_v5/railway/fold_0/full/results.csv
      fold_1:
        checkpoint: outputs/person_v5/railway/fold_1/full/weights/last.pt
        sha256: 2f5e0a58c3afc8a6dffcf67ca3c83852d220d6464c4820abff249dbdfaf7608e
        results: outputs/person_v5/railway/fold_1/full/results.csv
  gradual_transfer_allowed_if:
    any:
      - Recall_zero_shot_gt_D1_best
      - WorstFoldRecall_zero_shot_gt_D1_best

architecture:
  family: YOLO11m
  RGB_only_inference: true
  candidates:
    V5-A:
      model: configs/person_v5/models/yolo11m-p2.yaml
      P2: true
      coordinate_attention: false
      person_pasting: false
      gradual_transfer: false
    V5-B:
      model: configs/person_v5/models/yolo11m-p2-ca.yaml
      P2: true
      coordinate_attention: true
      person_pasting: false
      gradual_transfer: false
    V5-C:
      model: yolo11m.pt
      P2: false
      coordinate_attention: false
      person_pasting: true
      gradual_transfer: false
    V5-D:
      model: configs/person_v5/models/yolo11m-p2.yaml
      P2: true
      coordinate_attention: false
      person_pasting: true
      gradual_transfer: false
    V5-E:
      model: configs/person_v5/models/yolo11m-p2.yaml
      P2: true
      coordinate_attention: false
      person_pasting: true
      gradual_transfer: diagnostic_gate_only
    V5-S:
      role: supplementary_only_after_winner
      star_operation: deferred
  primary_comparisons: [V5-A_minus_B0, V5-C_minus_B0, V5-D_minus_B0]

range_or_scale_assignment:
  geometric_range_source: synchronized_LiDAR_object_geometry
  lidar_use: train_only_metadata_not_inference
  require_verified_RGB_object_link: true
  fallback: bbox_area_scale_group
  geometric_groups_m: {near: [0, 25], middle: [25, 60], far: [60, .inf]}
  scale_groups_area_ratio: {small: [0, 0.001], medium: [0.001, 0.01], large: [0.01, 1.0]}
  head_weight_formula:
    expression: "1 + lambda_s * max(0, 1 - sqrt(area_px) / tau_s)"
    lambda_s: 1.0
    tau_s_source: train_person_box_sqrt_area_q50
  head_preferences:
    small_or_far: [P2, P3]
    medium: [P3, P4]
    large_or_near: [P4, P5]

instance_pasting:
  source_scope: current_fold_train_scenes_only
  heldout_source_forbidden: true
  test_source_forbidden: true
  mask_required: true
  rectangular_crop_forbidden: true
  mask_preparation: segmentation_or_audited_grabcut
  critical_flags:
    - OUT_OF_BOUNDS
    - INVALID_SURFACE
    - IMPLAUSIBLE_SCALE
    - EXCESSIVE_OCCLUSION
    - MASK_HALO
    - DUPLICATE_INSTANCE
    - SOURCE_LEAKAGE
    - GT_OVERWRITE
  max_instances_per_frame: 2
  changed_frame_fractions: [0.25, 0.50]
  fold0_selects_fraction_once: true
  freeze_fraction_before_fold1: true
  minimum_mask_foreground_fraction: 0.10
  maximum_mask_foreground_fraction: 0.85
  maximum_mask_border_fraction: 0.25
  maximum_existing_person_iou: 0.30
  maximum_inserted_occlusion: 0.50
  minimum_box_side_px: 4
  brightness_matching: true
  alpha_blending: true
  range_blur: true
  seed: 20260725

gradual_transfer:
  enabled_only_if_diagnostic_allows: true
  replay_ratio: {OSDaR23: 4, CrowdHuman: 1}
  phases:
    T0: {epochs: 4, backbone: frozen, neck: frozen, head_lr_multiplier: 1.0}
    T1: {epochs: 4, backbone: frozen, neck_lr_multiplier: 0.5, head_lr_multiplier: 1.0}
    T2: {epochs: 8, upper_backbone_lr_multiplier: 0.1, neck_lr_multiplier: 0.5, head_lr_multiplier: 1.0}
    T3: {enabled: false, reason: separate_prospective_amendment_required}
  L2_SP:
    enabled: true
    lambda: 0.0001
    anchor: CrowdHuman_checkpoint
  hard_mining:
    enable_after_epoch: 8
    train_scenes_only: true

evaluation:
  unit: grouped_scene_id
  folds_first: [0, 1]
  folds_after_two_fold_PASS: [2, 3, 4]
  primary_metrics: [macro_recall, macro_small_recall, worst_fold_recall]
  secondary_metrics: [macro_mAP50, mAP50_95, precision, F1, FN_per_frame, FP_per_frame]
  paired_scene_cluster_bootstrap_iterations: 5000
  multiple_testing: Holm
  same_bootstrap_samples: true

two_fold_gate:
  require_all:
    macro_mAP50_min: 0.45
    macro_recall_min: 0.45
    macro_small_recall_min: 0.30
    worst_fold_recall_min: 0.30
    evaluator: PASS
    lost_GT: 0
    NaN_Inf: 0
  improvement_over_B0:
    any:
      delta_macro_recall_min: 0.03
      delta_macro_small_recall_min: 0.05
    delta_macro_mAP50_min: -0.01
  immutable_after_first_candidate_start: true

selection:
  lexicographic:
    - all_gates_passed
    - worst_fold_recall
    - macro_small_recall
    - macro_recall
    - macro_mAP50
    - lower_latency
    - lower_complexity

test_protocol:
  open_once_after_full_OOF_PASS: true
  checkpoint_threshold_NMS_pasting_hashes_frozen_first: true
  on_FAIL:
    test: sealed
    attacks: blocked
    H1_H4: not_evaluated

