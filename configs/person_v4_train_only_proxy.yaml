  official_test_globs:
    - outputs/person_v3/test/**
    - outputs/canonical_v2/test/**
  labels_and_images_for_forbidden_scenes_must_not_be_opened: true

selection:
  method: deterministic_centered_temporal_block
  ordering: [subsequence_id, frame_id, source_image]
  source_frame_cap_per_scene: 250
  heldout_frame_cap: 175
  random_sampling: false
  adjacent_frames_may_not_cross_roles_within_split: true

proxy_splits:
  - id: proxy_0
    source_scenes:
      - 8_station_altona_8
      - 12_vegetation_steady_12
      - 6_station_klein_flottbek_6
      - 9_station_ruebenkamp_9
    heldout_scene: 4_station_pedestrian_bridge_4
  - id: proxy_1
    source_scenes:
      - 4_station_pedestrian_bridge_4
      - 5_station_bergedorf_5
      - 12_vegetation_steady_12
      - 2_station_berliner_tor_2
    heldout_scene: 8_station_altona_8
  - id: proxy_2
    source_scenes:
      - 4_station_pedestrian_bridge_4
      - 8_station_altona_8
      - 6_station_klein_flottbek_6
      - 9_station_ruebenkamp_9
    heldout_scene: 12_vegetation_steady_12

paired_variants:
  execution_order: [A0, A3]
  A0:
    role: ERM_control
    nwd_qfl: false
    group_dro: false
    mixstyle: false
    scale_aware: false
    swad: false
  A3:
    role: full_DG_NWD_stack
    nwd_qfl: true
    group_dro: true
    mixstyle: true
    scale_aware: true
    swad: true

training:
  initialization_is_paired: true
  seed: 20260723
  input_size: 640
  batch: 1
  nominal_batch_size: 8
  workers: 2
  amp: false
  deterministic: true
  tiling: unchanged_from_person_v4
  fusion: unchanged_from_person_v4
  evaluator: unchanged_from_person_v4
  stages:
    stage1:
      epochs: 2
    stage2:
      epochs: 8
    stage3_swad:
      epochs: 2
  total_epochs: 12

early_reject:
  earliest_epoch: 8
  require_all:
    best_mAP50_delta_max: -0.03
    best_recall_delta_max: -0.03
    evaluations_without_improvement: 3
    losses_and_gradients_technically_valid: true
  train_loss_alone_may_stop: false

proxy_gate:
  paired_against: A0
  require_all:
    median_delta_mAP50_min: 0.03
    median_delta_recall_min: 0.03
    median_delta_small_recall_min: 0.05
    worst_split_delta_recall_min: 0.0
    improved_splits_min: 2
    split_count: 3
    maximum_single_split_recall_drop: 0.03
    NaN_Inf: 0
    lost_GT: 0
    evaluator_consistency: PASS

synthetic_four_domain:
  purpose: integration_test_only
  article_evidence: false
  source_domains: 3
  heldout_domains: 1
  expected_check: GroupDRO_and_MixStyle_reduce_style_overfitting

outputs:
  root: outputs/person_v4_proxy
  required:
    - protocol/protocol_lock.json
    - protocol/proxy_splits.json
    - protocol/proxy_frame_manifest.csv
    - protocol/proxy_tile_manifest.csv
    - protocol/isolation_audit.json
    - protocol/execution_status.json
    - tests/math_sanity.json
    - tests/synthetic_four_domain.json
    - results/paired_proxy_metrics.csv
    - results/proxy_gate.json
    - results/decision_trace.json
