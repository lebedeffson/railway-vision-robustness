  article_evidence: false
  may_open_external_fold0: false
  may_open_official_validation: false
  may_open_test: false
  may_interrupt_active_A3: false
  pass_allows: one_external_scene_fold_only
  fail_blocks: another_expensive_run_of_same_configuration

inputs:
  development_manifest: outputs/person_v3/protocol/development_manifest.csv
  development_manifest_sha256: b07be14110e0eb068de0aaa055759b2ac0123d531948200fa39e636638a7fcba
  outer_folds: outputs/person_v3/protocol/folds.json
  outer_folds_sha256: ff5a6268c394d396c05440b8d309cf5256f998b6c371c66bc52ac9c9bccb14bf
  tile_manifest: outputs/canonical_m4/tiling_audit/tile_manifest.csv
